<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Price Gallery — interior pieces and what they cost</title>
    <meta name="description" content="A six-piece interior gallery laid out in an asymmetric grid. Select any sofa, lamp or plant to reveal what it costs in Colombian pesos. No build step.">
    <link rel="canonical" href="https://pricegallery.wib.digital/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pricegallery.wib.digital/">
    <meta property="og:title" content="Price Gallery — interior pieces and what they cost">
    <meta property="og:description" content="A six-piece interior gallery laid out in an asymmetric grid. Select any sofa, lamp or plant to reveal what it costs in Colombian pesos. No build step.">
    <meta property="og:image" content="https://pricegallery.wib.digital/assets/img/logo/og-image.png">

    <link rel="icon" type="image/png" href="assets/img/logo/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap">

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">

    <script>
      // Flags the enhanced state before first paint, so the prices do not
      // flash on screen before the deferred scripts collapse them.
      document.documentElement.classList.add("has-js");
    </script>
    <script src="assets/js/modules/price-reveal.js" defer></script>
    <script src="assets/js/main.js" defer></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Pablo Nieto Pérez",
        "url": "https://wib.digital",
        "jobTitle": "Web Designer and Developer",
        "sameAs": [
          "https://www.fiverr.com/pablonietop",
          "https://www.linkedin.com/in/pablo-nieto-perez-39a530292"
        ]
      }
    </script>
  </head>

  <body class="page">
    <a class="skip-link" href="#gallery">Skip to the gallery</a>

    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <symbol id="icon-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.8 12V4.8a2 2 0 0 1 2-2H12a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8Z"></path>
        <circle cx="7.6" cy="7.6" r="1.3" fill="currentColor" stroke="none"></circle>
      </symbol>
    </svg>

    <header class="site-header container">
      <img class="site-header__logo" src="assets/img/logo/price-gallery.webp" width="256" height="256" alt="Price Gallery logo: a gold brushstroke inside a black and gold ring">
      <h1 class="site-header__title">Price Gallery</h1>
      <p class="site-header__tagline">Six interior pieces. Select any one to reveal its price.</p>
    </header>

    <main class="gallery container" id="gallery">
      <h2 class="visually-hidden">The pieces</h2>

      <ul class="gallery__grid">
        <li class="gallery__item gallery__item--square gallery__item--side-table">
          <button class="piece" type="button" aria-expanded="false">
            <img class="piece__photo" src="assets/img/content/side-table.webp" width="600" height="598" alt="White three-legged side table holding a gold vase, beside a daybed and a large potted palm" fetchpriority="high">
            <span class="piece__price">$450.000 COP</span>
            <span class="piece__badge"><svg aria-hidden="true" focusable="false"><use href="#icon-tag"></use></svg></span>
          </button>
        </li>

        <li class="gallery__item gallery__item--wide gallery__item--sofa">
          <button class="piece" type="button" aria-expanded="false">
            <img class="piece__photo" src="assets/img/content/sofa.webp" width="800" height="380" alt="Dark grey three-seat sofa with an open book on the cushion, next to an oval wooden coffee table">
            <span class="piece__price">$2.250.000 COP</span>
            <span class="piece__badge"><svg aria-hidden="true" focusable="false"><use href="#icon-tag"></use></svg></span>
          </button>
        </li>

        <li class="gallery__item gallery__item--wide gallery__item--bathtub">
          <button class="piece" type="button" aria-expanded="false">
            <img class="piece__photo" src="assets/img/content/bathtub.webp" width="800" height="381" alt="Freestanding stone bathtub against a textured concrete wall, standing on a bed of white pebbles" loading="lazy">
            <span class="piece__price">$8.175.000 COP</span>
            <span class="piece__badge"><svg aria-hidden="true" focusable="false"><use href="#icon-tag"></use></svg></span>
          </button>
        </li>

        <li class="gallery__item gallery__item--tall gallery__item--floor-lamp">
          <button class="piece" type="button" aria-expanded="false">
            <img class="piece__photo" src="assets/img/content/floor-lamp.webp" width="297" height="630" alt="Black metal floor lamp with a domed shade, angled against a sage green wall" loading="lazy">
            <span class="piece__price">$1.295.000 COP</span>
            <span class="piece__badge"><svg aria-hidden="true" focusable="false"><use href="#icon-tag"></use></svg></span>
          </button>
        </li>

        <li class="gallery__item gallery__item--square gallery__item--rubber-plant">
          <button class="piece" type="button" aria-expanded="false">
            <img class="piece__photo" src="assets/img/content/rubber-plant.webp" width="598" height="596" alt="Rubber plant with broad dark green leaves against a pale grey wall" loading="lazy">
            <span class="piece__price">$190.000 COP</span>
            <span class="piece__badge"><svg aria-hidden="true" focusable="false"><use href="#icon-tag"></use></svg></span>
          </button>
        </li>

        <li class="gallery__item gallery__item--square gallery__item--wooden-bench">
          <button class="piece" type="button" aria-expanded="false">
            <img class="piece__photo" src="assets/img/content/wooden-bench.webp" width="598" height="598" alt="Low solid-wood bench with a small barrel on top, surrounded by woven straw floor cushions" loading="lazy">
            <span class="piece__price">$190.000 COP</span>
            <span class="piece__badge"><svg aria-hidden="true" focusable="false"><use href="#icon-tag"></use></svg></span>
          </button>
        </li>
      </ul>
    </main>

    <footer class="site-footer container">
      <p class="site-footer__note">A front-end interaction study. The prices are sample values, not a live catalogue.</p>
      <p>
        Built by <a href="https://wib.digital" rel="noopener">wib.digital</a> —
        <a href="https://www.fiverr.com/pablonietop" rel="noopener">hire me on Fiverr</a>
      </p>
    </footer>
  </body>
</html>
